<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salita</title>
<meta name="description" content="Daily Tagalog and Taglish practice: spaced repetition, typed answers, verb aspect drills, listening, and progress tracking. Works offline on your phone.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0e8a78">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b3b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Salita">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Salita: phone-first, one column, bottom tab bar. Study mode takes over the screen. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#f6faf8; --fg:#15201e; --fg-2:#4f615d; --muted:#7f918c; --line:#dde6e2; --grid:#e8efec;
  --accent:#0e8a78; --accent-2:#0b5f53; --accent-fg:#ffffff; --accent-soft:#dff3ee;
  --hot:#d9640a; --hot-fg:#ffffff; --hot-soft:#fdeadb;
  --s1:#0e8a78; --s2:#d9640a; --s3:#4a3aa7;
  --heat1:#cfeee8; --heat2:#7fd0c1; --heat3:#23a88f; --heat4:#0b5f53;
  --good:#0f8a3c; --warn:#b8860b; --critical:#d03b3b; --good-soft:#e3f5e9; --critical-soft:#fde8e8; --warn-soft:#fff4d6;
  --shadow:0 8px 24px rgba(11,95,83,.12);
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1716; --surface:#15201e; --surface-2:#1b2927; --fg:#eef4f2; --fg-2:#aebcb8; --muted:#7d8d89; --line:#263431; --grid:#22302d;
    --accent:#23a88f; --accent-2:#0b3b35; --accent-fg:#06201c; --accent-soft:#163b35;
    --hot:#d96a22; --hot-fg:#ffffff; --hot-soft:#3b2416;
    --s1:#23a88f; --s2:#d96a22; --s3:#9085e9;
    --heat1:#16403a; --heat2:#1f6b5e; --heat3:#23a88f; --heat4:#6ad7c2;
    --good:#3ccf6e; --warn:#e2b23a; --critical:#ff6b6b; --good-soft:#163a24; --critical-soft:#3d1d1d; --warn-soft:#3a2f12;
    --shadow:0 8px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#15201e; --surface-2:#1b2927; --fg:#eef4f2; --fg-2:#aebcb8; --muted:#7d8d89; --line:#263431; --grid:#22302d;
  --accent:#23a88f; --accent-2:#0b3b35; --accent-fg:#06201c; --accent-soft:#163b35;
  --hot:#d96a22; --hot-fg:#ffffff; --hot-soft:#3b2416;
  --s1:#23a88f; --s2:#d96a22; --s3:#9085e9;
  --heat1:#16403a; --heat2:#1f6b5e; --heat3:#23a88f; --heat4:#6ad7c2;
  --good:#3ccf6e; --warn:#e2b23a; --critical:#ff6b6b; --good-soft:#163a24; --critical-soft:#3d1d1d; --warn-soft:#3a2f12;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;margin-inline:-16px;padding:22px 16px 18px;border-radius:0 0 22px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;box-shadow:var(--shadow)}
.top .eyebrow{color:rgba(255,255,255,.75)}
.top h1{color:#fff}
.top .hbtns{display:flex;gap:8px;flex:none}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:.95;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05;margin:0 0 10px;text-wrap:balance}
h3{font-size:14px;font-weight:700;margin:0 0 6px}
p{margin:0 0 10px}
.lede{color:var(--fg-2);max-width:60ch}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
section{margin-block:20px}
.btn{font:inherit;font-weight:600;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.hot{background:var(--hot);color:var(--hot-fg);border-color:var(--hot)}
.btn.big{width:100%;font-family:var(--display);font-size:24px;font-weight:800;padding:18px;box-shadow:var(--shadow)}
.btn.danger{color:var(--critical)}
.btn.small{padding:7px 11px;font-size:13px;font-weight:600;border-radius:9px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn-row .btn{flex:1 1 140px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
textarea{resize:vertical;min-height:56px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-2);font-weight:600}
label.t{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
label.t:last-child{border-bottom:0}
label.t input{width:auto;flex:none}
label.t span{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 130px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--accent),var(--hot))}
.tile .v{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;margin-top:6px;color:var(--accent)}
.tile .v small{font-size:14px;font-weight:700;color:var(--fg-2);margin-left:3px;font-family:var(--body)}
.tile .c{font-size:12px;color:var(--muted);margin-top:4px}
.status{font-size:13px;color:var(--fg-2);padding-block:10px 0;min-height:1.2em}
.status.warn{color:var(--critical)} .status.ok{color:var(--good);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.hot{background:var(--hot-soft);color:var(--hot)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between}
.hero .txt{flex:1;min-width:0}
.ring{flex:none}
.ring-bg{fill:none;stroke:var(--grid);stroke-width:8}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.ring-fg.hit{stroke:var(--good)}
.ring-t{font-family:var(--display);font-weight:800;font-size:22px;fill:var(--fg)}
.ring-s{font-size:9px;font-weight:700;letter-spacing:.1em;fill:var(--muted);text-transform:uppercase}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{font:inherit;font-size:11px;font-weight:700;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:10px;cursor:pointer;flex:1;max-width:120px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--accent)}
/* study */
.study{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.study .wrap{padding-bottom:24px}
.sbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.sbar .x{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:18px;flex:none}
.prog{flex:1;height:8px;background:var(--grid);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.sbar .n{font-variant-numeric:tabular-nums;font-size:13px;color:var(--fg-2);font-weight:600;min-width:52px;text-align:right}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:200px}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--accent),var(--hot))}
.qcard.intro::before{background:linear-gradient(90deg,var(--hot),var(--accent))}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qhead .pill{white-space:nowrap}
.prompt{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:6px 0 4px;overflow-wrap:anywhere}
.prompt.small{font-size:22px}
.prompt .blank{display:inline-block;min-width:3ch;border-bottom:3px solid var(--hot);color:var(--hot);padding:0 4px}
.sub{color:var(--fg-2);font-size:15px;margin-top:4px}
.hint{display:inline-block;margin-top:8px;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:4px 10px}
.answer-row{display:flex;gap:8px;margin-top:16px}
.answer-row input{font-size:18px;padding:12px 14px;border-radius:12px;flex:1}
.speak{font:inherit;border:1px solid var(--line);background:var(--surface-2);color:var(--accent);border-radius:12px;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.speak svg{width:22px;height:22px}
.speak.big{width:100%;height:84px;margin-top:10px;font-size:15px;font-weight:600;gap:10px}
.verdict{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.close{background:var(--warn-soft);color:var(--warn)} .verdict.bad{background:var(--critical-soft);color:var(--critical)}
.verdict .you{font-weight:500;color:var(--fg-2);font-size:13px;display:block;margin-top:2px}
.back{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.back .ans{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;color:var(--accent);overflow-wrap:anywhere}
.back .ans small{font-size:14px;color:var(--muted);font-weight:600;font-family:var(--body);margin-left:6px}
.back .meaning{font-size:16px;color:var(--fg);margin-top:4px}
.back .alts{font-size:13px;color:var(--muted);margin-top:4px}
.ex{margin-top:12px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.ex .tl{font-weight:600}
.ex .en{color:var(--fg-2);font-size:14px}
.ex .tg{color:var(--hot);font-size:14px;margin-top:3px}
.ex .tg::before{content:attr(data-l) " · ";font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--fg-2);margin-top:10px}
.asp{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px;font-size:13px}
.asp div{background:var(--surface-2);border-radius:8px;padding:6px 8px}
.asp b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.grades button small{font-weight:500;color:var(--muted);font-size:11px}
.grades button.sug{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.grades button[data-g="1"]{color:var(--critical)} .grades button[data-g="2"]{color:var(--warn)} .grades button[data-g="3"]{color:var(--accent)} .grades button[data-g="4"]{color:var(--good)}
.done{text-align:center;padding:30px 0}
.done .big-n{font-family:var(--display);font-size:64px;font-weight:800;line-height:1;color:var(--accent)}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
/* browse */
.search{display:flex;gap:8px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item summary{list-style:none;display:flex;gap:10px;align-items:center;cursor:pointer}
.item summary::-webkit-details-marker{display:none}
.item .w{font-weight:700;flex:1;min-width:0}
.item .m{color:var(--fg-2);font-size:13px;flex:1;min-width:0}
.item .st{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.item .body{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:14px}
.facets{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;font-size:12px;margin-top:8px;color:var(--fg-2)}
.facets b{color:var(--fg)}
/* charts */
.chart{display:block;max-width:100%}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .lbl{fill:var(--fg-2);font-size:11px;font-weight:600;font-family:var(--body)}
.chart .bar{fill:var(--s1)}
.chart .bar.hl{fill:var(--hot)}
.cap{font-size:12px;color:var(--muted);min-height:1.2em;margin-top:6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--grid);display:block}
.heat i.l1{background:var(--heat1)} .heat i.l2{background:var(--heat2)} .heat i.l3{background:var(--heat3)} .heat i.l4{background:var(--heat4)}
.legend{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n{font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
.bar-cell{display:flex;align-items:center;gap:8px}
.bar-cell i{height:8px;background:var(--s2);border-radius:4px;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:50;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div><div class="eyebrow" id="eyebrow">Tagalog · Taglish</div><h1 id="title">Salita</h1></div>
    <div class="hbtns"><button class="btn small ghost" id="btnLang" style="color:#fff;border-color:rgba(255,255,255,.4)" type="button" title="Switch language">⇄ <span id="langOther">Spanish</span></button><button class="btn small ghost" id="btnHelp" style="color:#fff;border-color:rgba(255,255,255,.4)" type="button">Help</button></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M4 9h16M9 5v4"/></svg>Today</button>
  <button role="tab" data-tab="browse" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Browse</button>
  <button role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button role="tab" data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a7.9 7.9 0 0 0 .1-6l2-1.5-2-3.5-2.4 1a8 8 0 0 0-5.2-3L11.5 0h-4l-.4 2a8 8 0 0 0-5.2 3L-.5 4 -2.5 7.5l2 1.5a7.9 7.9 0 0 0 .1 6" transform="translate(2.5 2)"/></svg>Settings</button>
</nav>
<div id="study" class="study" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
'use strict';
/* ===================== storage ===================== */
const LS = 'sl.';
/* Languages: each has its own deck file and its own progress/settings in storage (keys sl.<id>.*). */
const LANGS = [
  { id: 'tl', name: 'Tagalog', sub: 'Tagalog · Taglish', file: './decks/tagalog.json', input: 'fil', tts: ['fil', 'tl'], ttsFallback: ['id'], ttsNote: 'On iPhone: Settings › Accessibility › Spoken Content › Voices. An Indonesian voice is used as an approximation if present.',
    casualLabel: 'Taglish', casualPrompt: 'How would a friend text this?', formsLabel: 'Verb aspect', formsHelp: 'Conjugate verbs: completed / incompleted / contemplated.', accents: false, sample: 'Kumusta, kumain ka na ba?',
    forms: [{ key: 'completed', label: 'completed (did / have done)' }, { key: 'incompleted', label: 'incompleted (doing / do regularly)' }, { key: 'contemplated', label: 'contemplated (will do)' }],
    formKeys: ['infinitive', 'completed', 'incompleted', 'contemplated'], focusLabel: f => f + ' focus',
    topics: { core: 'Core words', daily: 'Daily life', food: 'Food', money: 'Money & admin', travel: 'Getting around', people: 'People & feelings', time: 'Time & numbers', chat: 'Taglish chat', verbs: 'Verbs', grammar: 'Grammar', phrases: 'Phrases', mine: 'My cards' } },
  { id: 'es', name: 'Spanish', sub: 'Spanish · Latin America', file: './decks/spanish.json', input: 'es', tts: ['es-MX', 'es-US', 'es-419', 'es-CO', 'es'], ttsFallback: [], ttsNote: 'On iPhone: Settings › Accessibility › Spoken Content › Voices › Spanish.',
    casualLabel: 'Casual', casualPrompt: 'How would a friend say this?', formsLabel: 'Conjugation', formsHelp: 'Conjugate verbs: present and preterite, all persons.', accents: true, sample: 'Hola, ¿ya comiste?',
    forms: [{ key: 'pres_yo', label: 'present · yo' }, { key: 'pres_tu', label: 'present · tú' }, { key: 'pres_el', label: 'present · él / ella / usted' }, { key: 'pres_nos', label: 'present · nosotros' }, { key: 'pres_ellos', label: 'present · ellos / ustedes' }, { key: 'pret_yo', label: 'preterite · yo' }, { key: 'pret_el', label: 'preterite · él / ella / usted' }],
    formKeys: ['infinitive', 'pres_yo', 'pres_tu', 'pres_el', 'pres_nos', 'pres_ellos', 'pret_yo', 'pret_tu', 'pret_el', 'pret_nos', 'pret_ellos', 'gerund', 'participle'], focusLabel: f => f.replace(/-/g, ' '),

function renderStats(main){

  let h = '<section class="tiles"><div class="tile"><div class="eyebrow">Streak</div><div class="v">' + streak + '<small>days</small></div><div class="c">' + Object.keys(byDay).length + ' study days total</div></div><div class="tile"><div class="eyebrow">Reviews</div><div class="v">' + state.log.length + '</div><div class="c">all time</div></div><div class="tile"><div class="eyebrow">Retention</div><div class="v">' + (ret == null ? '—' : Math.round(ret * 100) + '<small>%</small>') + '</div><div class="c">reviews passed, 30 days</div></div><div class="tile"><div class="eyebrow">Known</div><div class="v">' + notesKnown() + '<small>words</small></div><div class="c">' + c.review + ' cards in review</div></div></section>';
  h += '<section class="card"><h3>Consistency</h3><div class="heat" id="heat"></div><div class="legend">less <i style="background:var(--grid)"></i><i class="l1" style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i> more</div><div class="cap" id="heatCap">Last 20 weeks of reviews. Tap a day.</div></section>';
  h += '<section class="card"><h3>Coming up</h3><div id="forecast"></div></section>';
  const topics = {}; allCards().forEach(x => { const t = x.n.topic || 'other'; const o = topics[t] = topics[t] || { total: 0, known: 0, lapses: 0, reps: 0 }; o.total++; if (x.c && x.c.st === 2) o.known++; if (x.c) { o.lapses += x.c.lapses || 0; o.reps += x.c.reps || 0; } });
  const rows = Object.keys(topics).map(t => Object.assign({ t: t }, topics[t])).filter(r => r.reps).sort((a, b) => (b.lapses / Math.max(1, b.reps)) - (a.lapses / Math.max(1, a.reps)));
  h += '<section class="card"><h3>By topic</h3>' + (rows.length ? '<table><thead><tr><th>Topic</th><th class="n">Known</th><th class="n">Lapse rate</th></tr></thead><tbody>' + rows.map(r => { const lr = r.lapses / Math.max(1, r.reps); return '<tr><td>' + esc(topicLabel(r.t)) + '</td><td class="n">' + r.known + ' / ' + r.total + '</td><td class="n"><span class="bar-cell"><i style="width:' + Math.round(lr * 80) + 'px"></i>' + Math.round(lr * 100) + '%</span></td></tr>'; }).join('') + '</tbody></table>' : '<p class="lede">Study a few sessions and your weak topics show up here.</p>') + '</section>';
  const hard = Object.keys(state.cards).map(id => ({ id: id, c: state.cards[id] })).filter(x => (x.c.lapses || 0) >= 2 && state.byId[splitId(x.id)[0]]).sort((a, b) => b.c.lapses - a.c.lapses).slice(0, 10);
  h += '<section class="card"><h3>Leeches</h3>' + (hard.length ? '<table><thead><tr><th>Card</th><th class="n">Lapses</th></tr></thead><tbody>' + hard.map(x => { const n = state.byId[splitId(x.id)[0]]; return '<tr><td><b>' + esc(n.tl) + '</b> <span style="color:var(--muted)">' + esc(n.en) + ' · ' + FACET_NAMES[facetKind(splitId(x.id)[1])] + '</span></td><td class="n">' + x.c.lapses + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="lede">Cards you keep forgetting will be listed here so you can give them extra attention.</p>') + '</section>';
  main.innerHTML = h;
  /* heatmap: 20 weeks, columns = weeks, rows = Sun..Sat */
  const heat = main.querySelector('#heat'); const today = new Date(); today.setHours(0, 0, 0, 0); const start = new Date(today.getTime() - (139 + today.getDay()) * DAY); let cells = ''; const maxV = Math.max(1, ...Object.values(byDay));
  for (let d = new Date(start); d <= today; d = new Date(d.getTime() + DAY)) { const k = todayKey(d), v = byDay[k] || 0; const lvl = !v ? 0 : v < maxV * 0.25 ? 1 : v < maxV * 0.5 ? 2 : v < maxV * 0.75 ? 3 : 4; cells += '<i class="l' + lvl + '" data-k="' + k + '" data-v="' + v + '" title="' + k + ': ' + v + '"></i>'; }
  heat.innerHTML = cells; heat.scrollLeft = 9999; heat.querySelectorAll('i').forEach(i => { i.onclick = () => { main.querySelector('#heatCap').textContent = i.dataset.k + ': ' + i.dataset.v + ' reviews'; }; });
  const fc = []; const t0 = today.getTime(); for (let i = 0; i < 30; i++) fc.push({ v: 0, l: i === 0 ? 'today' : '+' + i, title: '' }); allCards().forEach(x => { if (x.c && x.c.st) { const di = Math.floor((x.c.due - t0) / DAY); if (di >= 0 && di < 30) fc[di].v++; else if (di < 0) fc[0].v++; } });
  fc.forEach((d, i) => { const dt = new Date(t0 + i * DAY); d.title = (i === 0 ? 'Today' : dt.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })) + ': ' + d.v + ' cards due'; d.hl = i === 0; });
  barChart(main.querySelector('#forecast'), fc, { label: 'Cards due per day for the next 30 days', capId: 'fcCap', cap: 'Cards due each day for the next 30 days. Tap a bar.' });
}
function renderSettings(main){
  const s = state.settings; const voices = voiceCandidates(); const topics = Object.keys(s.topics).sort();
  let h = '<section class="card"><h3>Language</h3><label class="f">Studying<select id="setLang">' + LANGS.map(l => '<option value="' + l.id + '"' + (l.id === L().id ? ' selected' : '') + '>' + esc(l.name) + '</option>').join('') + '</select></label><p class="lede" style="font-size:13px;margin-top:8px">Each language has its own deck, progress, streak and the settings below.</p></section>';
  h += '<section class="card"><h3>Daily load</h3><div class="row"><label class="f">New cards per day<input id="setNew" type="number" min="0" max="100" value="' + s.newPerDay + '"></label><label class="f">Max reviews per session<input id="setMax" type="number" min="10" max="1000" value="' + s.maxReviews + '"></label></div><label class="f" style="margin-top:10px">Target retention: <span id="retV">' + Math.round(s.retention * 100) + '%</span><input id="setRet" type="range" min="80" max="95" step="1" value="' + Math.round(s.retention * 100) + '"></label><p class="lede" style="font-size:13px;margin-top:8px">Higher retention means more frequent reviews. 90% is the usual sweet spot.</p></section>';
  h += '<section class="card"><h3>How you answer</h3><label class="t"><input id="setTyping" type="checkbox"' + (s.typing ? ' checked' : '') + '><span><b>Type answers</b><br><small style="color:var(--muted)">Off = flip the card and grade yourself</small></span></label></section>';
  h += '<section class="card"><h3>Card types</h3>' + Object.keys(FACET_NAMES).map(k => '<label class="t"><input type="checkbox" data-facet="' + k + '"' + (s.facets[k] ? ' checked' : '') + (k === 'l' && !pickVoice() ? ' disabled' : '') + '><span><b>' + FACET_NAMES[k] + '</b><br><small style="color:var(--muted)">' + FACET_HELP[k] + (k === 'l' && !pickVoice() ? ' No ' + L().name + ' voice found on this device.' : '') + '</small></span></label>').join('') + '</section>';
  h += '<section class="card"><h3>Topics</h3>' + topics.map(t => { const n = state.notes.filter(x => (x.topic || 'other') === t).length; return '<label class="t"><input type="checkbox" data-topic="' + esc(t) + '"' + (s.topics[t] ? ' checked' : '') + '><span>' + esc(topicLabel(t)) + ' <small style="color:var(--muted)">' + n + '</small></span></label>'; }).join('') + '</section>';
  h += '<section class="card"><h3>Audio</h3><label class="t"><input id="setTts" type="checkbox"' + (s.tts ? ' checked' : '') + '><span><b>Read Tagalog aloud</b><br><small style="color:var(--muted)">' + (voices.length ? voices.length + ' usable voice' + (voices.length === 1 ? '' : 's') + ' found' : 'No ' + L().name + ' voice on this device. ' + L().ttsNote) + '</small></span></label>' + (voices.length ? '<label class="f" style="margin-top:8px">Voice<select id="setVoice">' + voices.map(v => '<option value="' + esc(v.voiceURI) + '"' + ((pickVoice() || {}).voiceURI === v.voiceURI ? ' selected' : '') + '>' + esc(v.name) + ' (' + esc(v.lang) + (L().id === 'tl' && /^id/i.test(v.lang) ? ', Indonesian, approximate' : '') + ')</option>').join('') + '</select></label><label class="f" style="margin-top:8px">Speed: <span id="rateV">' + s.ttsRate + '</span><input id="setRate" type="range" min="0.6" max="1.2" step="0.05" value="' + s.ttsRate + '"></label><div class="btn-row"><button class="btn small" id="testVoice" type="button">Test: "' + esc(L().sample) + '"</button></div>' : '') + '</section>';
  h += '<section class="card"><h3>Appearance</h3><label class="f">Theme<select id="setTheme"><option value="auto"' + (s.theme === 'auto' ? ' selected' : '') + '>Match device</option><option value="light"' + (s.theme === 'light' ? ' selected' : '') + '>Light</option><option value="dark"' + (s.theme === 'dark' ? ' selected' : '') + '>Dark</option></select></label></section>';
  h += '<section class="card"><h3>Backup &amp; decks</h3><p class="lede" style="font-size:13px">Progress lives only on this device. One backup covers every language. Save it to Files or Drive now and then.</p><div class="btn-row">' + (navigator.share ? '<button class="btn primary" id="bkShare" type="button">Share backup</button>' : '') + '<button class="btn" id="bkDown" type="button">Download backup</button><button class="btn" id="bkRestore" type="button">Restore backup</button></div><input id="bkFile" type="file" accept="application/json,.json" hidden>' +
    '<h3 style="margin-top:16px">Import a deck file</h3><p class="lede" style="font-size:13px">Any JSON file of notes in the Salita format, such as cards Claude made from a conversation. They are added to the ' + esc(L().name) + ' deck. Existing notes with the same id are replaced; your progress on them is kept.</p><div class="btn-row"><button class="btn" id="deckImport" type="button">Import deck JSON</button><button class="btn" id="deckExport" type="button">Export my cards</button></div><input id="deckFile" type="file" accept="application/json,.json" hidden><div class="status" id="bkStatus"></div></section>';
  h += '<section class="card"><h3>About</h3><p class="lede" style="font-size:13px">Starter deck: ' + esc(state.deck.name) + (state.deck.version ? ' (' + esc(state.deck.version) + ')' : '') + ' · ' + state.deck.notes.length + ' notes · ' + state.extra.length + ' of your own. Scheduling by FSRS-4.5. Nothing leaves your phone.</p><div class="btn-row"><button class="btn danger" id="resetAll" type="button">Reset all progress</button></div></section>';
  main.innerHTML = h;
  const upd = () => { save('settings'); };
  main.querySelector('#setLang').onchange = e => { switchLang(e.target.value); };
  main.querySelector('#setNew').onchange = e => { s.newPerDay = clamp(Number(e.target.value) || 0, 0, 100); upd(); };
  main.querySelector('#setMax').onchange = e => { s.maxReviews = clamp(Number(e.target.value) || 200, 10, 1000); upd(); };
  main.querySelector('#setRet').oninput = e => { s.retention = Number(e.target.value) / 100; main.querySelector('#retV').textContent = e.target.value + '%'; upd(); };
  main.querySelector('#setTyping').onchange = e => { s.typing = e.target.checked; upd(); };
  main.querySelectorAll('[data-facet]').forEach(c => { c.onchange = () => { s.facets[c.dataset.facet] = c.checked; upd(); }; });
  main.querySelectorAll('[data-topic]').forEach(c => { c.onchange = () => { s.topics[c.dataset.topic] = c.checked; upd(); }; });
  main.querySelector('#setTts').onchange = e => { s.tts = e.target.checked; upd(); renderSettings(main); };
  const sv = main.querySelector('#setVoice'); if (sv) sv.onchange = e => { s.voice = e.target.value; upd(); };
  const sr = main.querySelector('#setRate'); if (sr) sr.oninput = e => { s.ttsRate = Number(e.target.value); main.querySelector('#rateV').textContent = e.target.value; upd(); };
  const tv = main.querySelector('#testVoice'); if (tv) tv.onclick = () => { if (!speak(L().sample)) toast('No voice available'); };
  main.querySelector('#setTheme').onchange = e => { state.settings.theme = e.target.value; lsPutRaw('theme', e.target.value); upd(); applyTheme(); };
  const sh = main.querySelector('#bkShare'); if (sh) sh.onclick = shareBackup; main.querySelector('#bkDown').onclick = downloadBackup;
  main.querySelector('#bkRestore').onclick = () => main.querySelector('#bkFile').click(); main.querySelector('#bkFile').onchange = e => { if (e.target.files[0]) restoreFromFile(e.target.files[0]); };
  main.querySelector('#deckImport').onclick = () => main.querySelector('#deckFile').click(); main.querySelector('#deckFile').onchange = e => { if (e.target.files[0]) importDeckFile(e.target.files[0]); };
  main.querySelector('#deckExport').onclick = () => { downloadText(JSON.stringify({ name: 'My Salita cards (' + L().name + ')', lang: L().id, version: todayKey(), notes: state.extra }, null, 1), 'salita-' + L().id + '-my-cards-' + todayKey() + '.json'); };
  main.querySelector('#resetAll').onclick = () => { if (!confirm('Erase all ' + L().name + ' study progress on this device? Your own cards are kept.')) return; if (!confirm('Really erase? There is no undo unless you have a backup.')) return; state.cards = {}; state.log = []; state.daily = { day: '', newCount: 0 }; save('cards'); save('log'); save('daily'); toast(L().name + ' progress erased'); render(); };
}
function applyTheme(){ const t = lsGetRaw('theme', state.settings.theme); if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }

/* ===================== backup / restore / import ===================== */
function langData(id){ if (id === LANG.id) return { settings: state.settings, cards: state.cards, log: state.log, extra: state.extra, hidden: state.hidden }; return { settings: lsGetRaw(id + '.settings', {}), cards: lsGetRaw(id + '.cards', {}), log: lsGetRaw(id + '.log', []), extra: lsGetRaw(id + '.extra', []), hidden: lsGetRaw(id + '.hidden', {}) }; }
function backupJson(){ const languages = {}; LANGS.forEach(l => { languages[l.id] = langData(l.id); }); return JSON.stringify({ app: 'salita', version: 2, exportedAt: new Date().toISOString(), lang: LANG.id, theme: lsGetRaw('theme', 'auto'), languages: languages }, null, 0); }
function backupName(){ return 'salita-backup-' + todayKey() + '.json'; }
function downloadText(text, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function downloadBackup(){ downloadText(backupJson(), backupName()); setStatus('Backup downloaded: ' + backupName(), 'ok'); }
async function shareBackup(){ try { const file = new File([backupJson()], backupName(), { type: 'application/json' }); if (navigator.canShare && !navigator.canShare({ files: [file] })) throw new Error('no'); await navigator.share({ files: [file], title: 'Salita backup' }); setStatus('Backup shared', 'ok'); } catch (e) { if (e && e.name === 'AbortError') return; downloadBackup(); } }
function setStatus(msg, cls){ const el = document.getElementById('bkStatus'); if (el) { el.textContent = msg; el.className = 'status ' + (cls || ''); } else toast(msg); }
function readJsonFile(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { try { res(JSON.parse(r.result)); } catch (e) { rej(new Error('that file is not valid JSON')); } }; r.onerror = () => rej(new Error('could not read the file')); r.readAsText(file); }); }
function mergeLang(id, data){
  const cur = langData(id); let added = 0, updated = 0;
  Object.keys(data.cards || {}).forEach(cid => { const inc = data.cards[cid], c = cur.cards[cid]; if (!c) { cur.cards[cid] = inc; added++; } else if ((inc.reps || 0) > (c.reps || 0) || (inc.last || 0) > (c.last || 0)) { cur.cards[cid] = inc; updated++; } });
  const seen = {}; cur.log.forEach(r => { seen[r.t + ':' + r.c] = 1; }); (data.log || []).forEach(r => { if (!seen[r.t + ':' + r.c]) { cur.log.push(r); seen[r.t + ':' + r.c] = 1; } }); cur.log.sort((a, b) => a.t - b.t);
  const ex = {}; cur.extra.forEach(n => { ex[n.id] = n; }); (data.extra || []).forEach(n => { ex[n.id] = n; }); cur.extra = Object.values(ex);
  Object.assign(cur.hidden, data.hidden || {}); if (data.settings && !Object.keys(cur.settings || {}).length) cur.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
  if (id === LANG.id) { state.cards = cur.cards; state.log = cur.log; state.extra = cur.extra; state.hidden = cur.hidden; if (cur.settings !== state.settings) Object.assign(state.settings, DEFAULT_SETTINGS, cur.settings); ['cards', 'log', 'extra', 'hidden', 'settings'].forEach(save); }
  else ['cards', 'log', 'extra', 'hidden', 'settings'].forEach(k => lsPutRaw(id + '.' + k, cur[k]));
  return { added: added, updated: updated, extra: cur.extra.length };
}
async function restoreFromFile(file){
  try { const data = await readJsonFile(file); if (!data || data.app !== 'salita') throw new Error('not a Salita backup');
    const per = data.languages ? data.languages : { [data.lang || 'tl']: data };
    const parts = []; Object.keys(per).forEach(id => { const lg = LANGS.find(l => l.id === id); if (!lg) return; const r = mergeLang(id, per[id]); parts.push(lg.name + ': ' + r.added + ' added, ' + r.updated + ' updated, ' + r.extra + ' own cards'); });
    rebuildNotes(); setStatus('Restored. ' + parts.join(' · '), 'ok'); }
  catch (e) { setStatus('Restore failed: ' + e.message, 'warn'); }
}
function validateNote(n){ if (!n || typeof n !== 'object' || !n.id || !n.tl || !n.en) return false; if (!n.type) n.type = 'vocab'; if (!n.topic) n.topic = 'mine'; if (!n.tier) n.tier = 2; return true; }
async function importDeckFile(file){
  try { const data = await readJsonFile(file); const notes = Array.isArray(data) ? data : (data && Array.isArray(data.notes) ? data.notes : null); if (!notes) throw new Error('expected a JSON array of notes or {"notes": [...]}');
    if (data && data.lang && data.lang !== L().id) throw new Error('this file is for ' + ((LANGS.find(l => l.id === data.lang) || {}).name || data.lang) + '; switch language first');
    let ok = 0, bad = 0; const ex = {}; state.extra.forEach(n => { ex[n.id] = n; }); notes.forEach(n => { if (validateNote(n)) { ex[n.id] = n; ok++; } else bad++; }); state.extra = Object.values(ex); save('extra'); rebuildNotes(); save('settings');
    setStatus('Imported ' + ok + ' notes' + (bad ? ', skipped ' + bad + ' invalid' : '') + '. They join the new-card queue by tier.', 'ok'); }
  catch (e) { setStatus('Import failed: ' + e.message, 'warn'); }
}

/* ===================== boot ===================== */
async function loadDeck(){
  state.deck = { name: 'deck', version: '', notes: [] };
  try { const r = await fetch(L().file, { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); const d = await r.json(); state.deck = { name: d.name || 'Starter deck', version: d.version || '', notes: (d.notes || []).filter(validateNote) }; }
  catch (e) { try { const r = await caches.match(L().file); if (r) { const d = await r.json(); state.deck = { name: d.name || 'Starter deck', version: d.version || '', notes: (d.notes || []).filter(validateNote) }; } } catch (x) {} }
  rebuildNotes(); save('settings');
  document.getElementById('eyebrow').textContent = L().sub; const other = LANGS[(LANGS.indexOf(L()) + 1) % LANGS.length]; document.getElementById('langOther').textContent = other.name;
}
document.querySelectorAll('.tabs [role=tab]').forEach(b => { b.onclick = () => { state.tab = b.dataset.tab; render(); }; });
document.getElementById('btnLang').onclick = () => { const other = LANGS[(LANGS.indexOf(L()) + 1) % LANGS.length]; switchLang(other.id); };
document.getElementById('btnHelp').onclick = () => { alert('Salita drills a language the way a spaced-repetition app does: you see each card right before you would forget it.\n\n• New words appear once with their meaning, then get tested later in the same session.\n• Type the answer and tap Check. Punctuation is ignored; Spanish accents count. Close answers count as Hard.\n• Again = would not have produced it. Hard = got it, slowly. Good = fine. Easy = instant.\n• Production, Listening, Casual and conjugation cards unlock after you pass the word once.\n• ⇄ switches between Tagalog and Spanish; each keeps its own progress.\n• Everything stays on this phone. Back up from Settings.'); };
applyTheme();
loadDeck().then(render);
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); }); }
</script>
